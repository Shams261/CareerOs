allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true
# Never let a script run trigger an implicit install: production containers run as an unprivileged
# user on a read-only install, and CI/local installs are explicit (`pnpm install --frozen-lockfile`).
verifyDepsBeforeRun: false
# WI-044: patched versions of transitive dependencies with security advisories
# (source-map-js via next > postcss; fast-uri via the Prisma CLI's ajv; vite via vitest, dev only).
overrides:
  source-map-js: '>=1.2.2'
  fast-uri: '>=3.1.9 <4'
  vite: '>=8.3.3 <9'
