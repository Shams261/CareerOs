name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: careeros
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: careeros_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careeros -d careeros_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://careeros:ci-only-password@localhost:5432/careeros_test
      TEST_DATABASE_URL: postgresql://careeros:ci-only-password@localhost:5432/careeros_test
      OWNER_EMAIL: ci-owner@example.com
      APP_PASSWORD: ci-only-app-password-not-for-deployment
      CRON_SECRET: ci-only-scheduler-secret-not-for-deployment
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Install pinned package manager
        run: npm install --global pnpm@11.19.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate database client
        run: pnpm db:generate
      - name: Lint and formatting
        run: pnpm lint
      - name: Type checks
        run: pnpm typecheck
      - name: Documentation links
        run: pnpm docs:check
      - name: Apply migrations and verify repeatable seed
        run: |
          pnpm db:deploy
          pnpm db:seed
          pnpm db:seed
      - name: All tests (database required)
        run: pnpm test:ci
      - name: Production build
        run: pnpm build
