name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: careeros
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: careeros_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careeros -d careeros_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://careeros:ci-only-password@localhost:5432/careeros_test
      TEST_DATABASE_URL: postgresql://careeros:ci-only-password@localhost:5432/careeros_test
      OWNER_EMAIL: ci-owner@example.com
      CRON_SECRET: ci-only-scheduler-secret-not-for-deployment
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install pinned package manager
        run: npm install --global pnpm@11.19.0
      - name: Locate pnpm store
        id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: ${{ runner.os }}-node24-pnpm11-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node24-pnpm11-
      - name: Restore Next compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      # WI-044: a known high or critical advisory in a production dependency fails the build.
      - name: Dependency audit (production)
        run: pnpm audit --prod --audit-level high
      - name: Generate database client
        run: pnpm db:generate
      - name: Lint and formatting
        run: pnpm lint
      - name: Documentation links
        run: pnpm docs:check
      - name: Apply migrations and verify repeatable seed
        run: |
          pnpm db:deploy
          pnpm exec tsx scripts/verify-seed.ts
      - name: All tests (database required)
        run: pnpm test:ci
      # Next build runs the TypeScript check. The Prisma client was generated above.
      - name: Production build and type checks
        run: pnpm exec next build --webpack
  image:
    # The production image must keep building (ADR-013). Runs alongside "quality"; nothing is pushed.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build the runtime image
        run: docker build --target runtime --tag silsila:ci .
      - name: Image starts and validates configuration
        # With no configuration the server must refuse to start (exit 1) and name variables only.
        run: |
          set +e
          output=$(docker run --rm -e NODE_ENV=production silsila:ci 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 1
          echo "$output" | grep -q 'DATABASE_URL'
  e2e:
    # WI-052: the core journeys in a real browser against the production build, with axe on
    # each page. Fakes stand in for Google and OpenRouter on loopback; nothing real is reached.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: careeros
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: careeros
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careeros -d careeros"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_DATABASE_URL: postgresql://careeros:ci-only-password@localhost:5432/silsila_e2e
      # The build reads the same throwaway values the server runs with (e2e/env.ts).
      DATABASE_URL: postgresql://careeros:ci-only-password@localhost:5432/silsila_e2e
      OWNER_EMAIL: owner@example.com
      CRON_SECRET: e2e-only-scheduler-secret-not-for-deployment
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install pinned package manager
        run: npm install --global pnpm@11.19.0
      - name: Locate pnpm store
        id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: ${{ runner.os }}-node24-pnpm11-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node24-pnpm11-
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Production build
        run: pnpm build
      - name: Browser journeys with axe
        run: pnpm test:e2e
      - name: Keep the report when a journey fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
