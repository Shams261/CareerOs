services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: careeros
      POSTGRES_PASSWORD: careeros
      POSTGRES_DB: careeros
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - careeros_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U careeros']
      interval: 5s
      retries: 10
volumes:
  careeros_data:
